services:
  chii:
    image: ghcr.io/motxi/chii:latest
    container_name: chii

    env_file:
      - .env.chii

    volumes:
      # Host-side path (left of the colon) can be whatever you want.
      # The container-side path must stay as "/data".
      - ./volumes/chii/data:/data

    restart: unless-stopped
